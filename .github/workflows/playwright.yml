# ══════════════════════════════════════════════════════════════════════════════
# Playwright E2E Tests
#
# PURPOSE:
#   Runs the full Playwright test suite against the deployed production
#   environment on every push to main. Tests run INSIDE the Docker image built
#   from ./Dockerfile (Node 20 + all Playwright browsers pre-installed) rather
#   than being installed directly on the runner — the same image used for local
#   `docker compose up` runs here too, so CI and local runs can't drift apart.
#   Uploads the HTML report as an artifact so results can be reviewed directly
#   in the GitHub Actions UI.
#
# TRIGGER: push to main
#
# NOTES:
#   - Tests run against https://eventhub.rahulshettyacademy.com (live site)
#   - Chromium only at test-runtime (per playwright.config.ts projects), though
#     the Docker image installs all three Playwright browsers
#   - HTML report is retained for 30 days as a downloadable artifact
# ══════════════════════════════════════════════════════════════════════════════

name: Playwright E2E Tests

on:
  push:
    branches: [main]

  # Allow manual runs from the GitHub Actions UI
  workflow_dispatch:

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ╔═══════════════════════════════════════════════════════════════════════════
  # ║  Playwright Tests
  # ║  Builds the Docker image, runs all specs inside it, uploads the HTML report.
  # ╚═══════════════════════════════════════════════════════════════════════════
  playwright:
    name: Run Playwright Tests (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Build the test image ─────────────────────────────────────────────────
      # Node 20 + `npx playwright install --with-deps` (all browsers, OS deps) —
      # see ./Dockerfile. docker/docker-compose are preinstalled on ubuntu-latest.
      - name: Build Docker image
        run: docker compose build

      # ── Run all Playwright tests inside the container ───────────────────────
      # docker-compose.yml bind-mounts ./playwright-report and ./test-results,
      # so the report lands on the runner's filesystem for the upload step below
      # exactly as if the tests had run directly on the host.
      # continue-on-error ensures the artifact upload step still runs on failure.
      - name: Run Playwright tests in Docker container
        run: docker compose run --rm playwright-tests
        continue-on-error: true

      # ── Upload HTML report as artifact ───────────────────────────────────────
      # The report is generated in playwright-report/ by the html reporter.
      # Retained for 30 days so the team can review results after a run.
      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 30
